<html lang="en">
<head>

<style>
:root{--paper:#e9e5da;--ink:#292e27;--muted:#686b60;--line:#c7c7b9;--accent:#59664b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.3' d='M0 0h160v160H0z'/%3E%3C/svg%3E")}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button:disabled{cursor:default;opacity:.4}main{max-width:900px;margin:auto;padding:42px 28px 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}h1{font-family:Georgia,serif;font-size:30px;font-weight:normal;letter-spacing:-1px;margin:0}.mono{font-family:'Courier New',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase}header p{margin:6px 0 0;color:var(--muted)}.edition{color:var(--muted)}.player{max-width:450px;margin:48px auto 40px;text-align:center}.eyebrow{color:var(--muted);margin-bottom:22px}.deck{position:relative;padding:22px 22px 17px;border-radius:12px;background:linear-gradient(145deg,#3a3f35,#252b25);box-shadow:0 15px 25px #292e2720,inset 0 1px 1px #ffffff40;border:1px solid #20271f;overflow:hidden}.tape{width:100%;display:block;filter:drop-shadow(0 4px 4px #0005);transition:transform .25s,opacity .25s}.deck.swapping .tape{transform:translateY(-125%) rotate(-3deg);opacity:0}.reel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite;animation-play-state:paused}.playing .reel{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}.hardware{display:flex;justify-content:space-between;color:#acae9f;font-size:11px;margin-top:13px;letter-spacing:2px}.lamp{display:inline-block;width:5px;height:5px;background:#888b77;border-radius:50%;margin-right:6px}.playing .lamp{background:#b8cc8d;box-shadow:0 0 7px #b8cc8d}.now{margin:25px 0 5px;font-size:19px;font-family:Georgia,serif}.albumname{color:var(--muted);font-size:13px;margin:0 0 22px}.progress{display:flex;gap:12px;align-items:center;color:var(--muted);font-family:monospace;font-size:12px}input[type=range]{accent-color:var(--accent);height:18px;min-width:0;cursor:pointer}.progress input{flex:1;width:100%}.controls{display:flex;justify-content:center;align-items:center;gap:24px;margin:18px 0}.controls button{border:0;background:transparent;width:40px;height:40px;font-size:20px}.controls .play{background:var(--ink);color:var(--paper);border-radius:50%;width:51px;height:51px}.repeat{display:block;margin:0 auto 16px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:transparent;font-size:13px}.repeat[aria-pressed=true]{color:var(--paper);background:var(--accent);border-color:var(--accent)}.preferences{display:flex;justify-content:center;align-items:center;gap:20px;color:var(--muted);font-size:12px}.preferences label{display:flex;align-items:center;gap:6px}.preferences input[type=range]{width:65px}.preferences input[type=checkbox]{accent-color:var(--accent)}.status{font-size:13px;color:var(--muted);min-height:18px;margin:17px 0 0}.sectionheading{gap:12px;flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:20px 0}h2{font-weight:normal;font-size:14px;margin:0}.albums{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.album{background:none;border:0;text-align:left;padding:0}.cover{aspect-ratio:1;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;background:#59664b;color:#eceadb;border:3px solid transparent;transition:transform .2s}.album:hover .cover{transform:translateY(-4px)}.album[aria-pressed=true] .cover{outline:1px solid var(--ink);outline-offset:4px}.cover .name{font:italic 24px/1.05 Georgia,serif;max-width:130px}.cover .number{font:12px monospace;opacity:.75}.cover .rule{width:100%;height:1px;background:currentColor;opacity:.4}.cover-1{background:#505c52}.cover-2{background:#b7a985;color:#34392e}.cover-3{background:#4f535f}.albumtitle{display:block;font-size:14px;margin-top:13px}.albumtype{display:block;font-size:12px;color:var(--muted);margin-top:5px}.tracks{margin:27px 0 34px}.track{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:18px;padding:16px 10px;text-align:left;font-size:14px}.track:hover,.track[aria-pressed=true]{background:#d8dbcf}.tracknum{color:var(--muted);font:12px monospace}.tracktitle{flex:1}.badge{font:11px monospace;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}footer span:last-child{font-family:Georgia,serif;font-style:italic}@media(max-width:600px){main{padding:27px 20px}.edition{display:none}.player{margin-top:35px}.albums{grid-template-columns:repeat(2,1fr);gap:20px}.cover .name{font-size:27px}.deck{padding:15px}.preferences{gap:12px}footer{gap:20px}h1{font-size:28px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main>
<header><div><h1>Saints Radio</h1><p class="mono">Electronic sounds by St.Michael</p></div><span class="edition mono">Independent frequencies / 001</span></header>
<section class="player" aria-label="Music player"><div class="eyebrow mono">A little listening room</div>
<div class="deck" id="deck">
<svg class="tape" viewBox="0 0 400 250" role="img" aria-label="Cassette tape for the selected album">
<rect x="5" y="5" width="390" height="240" rx="15" fill="#c9c4b3" stroke="#a29f91" stroke-width="2"/>
<rect x="21" y="22" width="358" height="155" rx="8" fill="#59664b" id="tapeColor"/>
<text x="37" y="47" fill="#eceadb" font-family="monospace" font-size="10" letter-spacing="2">ST.MICHAEL / SAINTS RADIO</text>
<text id="tapeTitle" x="37" y="76" fill="#eceadb" font-family="Georgia,serif" font-size="20">Ballad of the Soul</text>
<path d="M35 87H365" stroke="#eceadb" opacity=".5"/>
<rect x="60" y="100" width="280" height="63" rx="31" fill="#252c23" stroke="#c9c4b3" stroke-width="5"/>
<rect x="137" y="113" width="126" height="37" rx="3" fill="#9b977f"/>
<path d="M141 125H259M141 130H259M141 135H259" stroke="#494d3c"/>
<g class="reel"><circle cx="99" cy="131" r="26" fill="#c9c4b3"/><circle cx="99" cy="131" r="14" fill="#34392d"/><path d="M99 113v10M99 139v10M81 131h10M107 131h10M86 118l7 7M105 137l7 7M86 144l7-7M105 125l7-7" stroke="#c9c4b3" stroke-width="5"/></g>
<g class="reel"><circle cx="301" cy="131" r="26" fill="#c9c4b3"/><circle cx="301" cy="131" r="14" fill="#34392d"/><path d="M301 113v10M301 139v10M283 131h10M309 131h10M288 118l7 7M307 137l7 7M288 144l7-7M307 125l7-7" stroke="#c9c4b3" stroke-width="5"/></g>
<text x="33" y="165" fill="#eceadb" font-family="monospace" font-size="13">A</text><text x="345" y="165" fill="#eceadb" font-family="monospace" font-size="10">90</text>
<path d="M107 192h186l20 43H87z" fill="#b1ad9b" stroke="#979581"/>
<circle cx="133" cy="213" r="7" fill="#393e32"/><circle cx="267" cy="213" r="7" fill="#393e32"/><circle cx="165" cy="218" r="4" fill="#393e32"/><circle cx="235" cy="218" r="4" fill="#393e32"/>
<g fill="#757866"><circle cx="18" cy="18" r="3"/><circle cx="382" cy="18" r="3"/><circle cx="18" cy="232" r="3"/><circle cx="382" cy="232" r="3"/></g>
</svg><div class="hardware mono"><span><i class="lamp"></i>Stereo</span><span>SR—01 / Tape deck</span></div></div>
<p class="now" id="now">Select a track</p><p class="albumname" id="albumname">Ballad of the Soul</p>
<div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position" disabled><span id="duration">—:—</span></div>
<div class="controls"><button id="previous" aria-label="Previous track">Ⅰ◀</button><button class="play" id="play" aria-label="Play">▶</button><button id="next" aria-label="Next track">▶Ⅰ</button></div>
<button id="repeat" class="repeat" aria-pressed="false" aria-label="Repeat off. Click to repeat album.">↻ Repeat off</button>
<div class="preferences"><label>Volume <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></label><label><input id="effects" type="checkbox" checked> Tape sounds</label></div>
<p id="status" class="status" role="status">Pick a tape. Stay awhile.</p><audio id="audio" preload="metadata"></audio>
</section>
<section aria-label="Album collection"><div class="sectionheading"><h2 class="mono">The tape collection</h2><span class="mono" style="color:var(--muted)">Design preview · 04 tapes</span></div><div id="albums" class="albums"></div><div id="tracks" class="tracks" aria-label="Tracklist"></div></section>
<footer><span>Saints Radio · St.Michael</span><span>Made to be listened to.</span></footer>
</main>
<script>
// Replace placeholder track titles and add an audio path, e.g. src: 'audio/song.mp3'.
const albums=[
 {title:'Ballad of the Soul',color:'#59664b',type:'Afro-jungle / forthcoming',tracks:[{title:'Track 01',src:''},{title:'Track 02',src:''},{title:'Track 03',src:''},{title:'Track 04',src:''}]},
 {title:'Untitled / 02',color:'#505c52',type:'Post-rock jungle / placeholder',tracks:[{title:'Track 01',src:''},{title:'Track 02',src:''}]},
 {title:'Untitled / 03',color:'#b7a985',type:'Arabic jungle / placeholder',tracks:[{title:'Track 01',src:''},{title:'Track 02',src:''}]},
 {title:'Untitled / 04',color:'#4f535f',type:'Jazz jungle / placeholder',tracks:[{title:'Track 01',src:''},{title:'Track 02',src:''}]}
];
const $=id=>document.getElementById(id),audio=$('audio');let albumIndex=0,trackIndex=-1,swapping=false,context,repeatMode='off';
audio.volume=.8;
function render(){
 $('albums').replaceChildren(...albums.map((album,i)=>{const button=document.createElement('button');button.className='album';button.setAttribute('aria-pressed',i===albumIndex);button.innerHTML=`<span class="cover cover-${i}"><span class="number">SR / 00${i+1}</span><span class="name"></span><span class="rule"></span></span><span class="albumtitle"></span><span class="albumtype"></span>`;button.querySelector('.name').textContent=album.title;button.querySelector('.albumtitle').textContent=album.title;button.querySelector('.albumtype').textContent=album.type;button.onclick=()=>selectAlbum(i);return button}));
 $('tracks').replaceChildren(...albums[albumIndex].tracks.map((track,i)=>{const button=document.createElement('button');button.className='track';button.setAttribute('aria-pressed',i===trackIndex);button.innerHTML=`<span class="tracknum">${String(i+1).padStart(2,'0')}</span><span class="tracktitle"></span><span class="badge"></span>`;button.querySelector('.tracktitle').textContent=track.title;button.querySelector('.badge').textContent=track.src?'PLAY':'NO AUDIO YET';button.onclick=()=>selectTrack(i);return button}));
 $('albumname').textContent=albums[albumIndex].title;$('tapeTitle').textContent=albums[albumIndex].title;$('tapeColor').setAttribute('fill',albums[albumIndex].color);
}
async function sound(action='stop'){
 if(!$('effects').checked)return;
 try{
  context??=new(window.AudioContext||window.webkitAudioContext)();
  if(context.state==='suspended')await context.resume();
  const t=context.currentTime,level=Number($('volume').value);
  // A springy low clunk with two short latch impacts, rather than a musical beep.
  const buffer=context.createBuffer(1,Math.ceil(context.sampleRate*.09),context.sampleRate);
  const data=buffer.getChannelData(0);
  for(let n=0;n<data.length;n++)data[n]=(Math.random()*2-1)*Math.exp(-n/(context.sampleRate*.008));
  const output=context.createGain();output.gain.value=level;output.connect(context.destination);
  for(const [offset,strength] of [[0,.55],[action==='stop'?.032:.022,.26]]){
   const source=context.createBufferSource(),filter=context.createBiquadFilter(),gain=context.createGain();
   source.buffer=buffer;filter.type='bandpass';filter.frequency.value=action==='stop'?1800:2400;filter.Q.value=.65;
   gain.gain.value=strength;source.connect(filter).connect(gain).connect(output);source.start(t+offset);
  }
  const body=context.createOscillator(),bodyGain=context.createGain();
  body.type='sine';body.frequency.setValueAtTime(action==='stop'?160:210,t);body.frequency.exponentialRampToValueAtTime(65,t+.045);
  bodyGain.gain.setValueAtTime(.22,t);bodyGain.gain.exponentialRampToValueAtTime(.001,t+.065);
  body.connect(bodyGain).connect(output);body.start(t);body.stop(t+.07);
  body.onended=()=>setTimeout(()=>output.disconnect(),100);
 }catch{}
}
function clearAudio(){audio.pause();audio.removeAttribute('src');audio.load();$('seek').disabled=true;$('seek').value=0;$('elapsed').textContent='0:00';$('duration').textContent='—:—'}
async function selectAlbum(i){
 if(i===albumIndex||swapping)return;
 swapping=true;clearAudio();await sound('stop');
 $('deck').classList.add('swapping');
 await new Promise(r=>setTimeout(r,260));
 albumIndex=i;trackIndex=-1;render();$('now').textContent='Select a track';
 $('deck').classList.remove('swapping');
 await new Promise(r=>setTimeout(r,260));
 await sound('play');
 $('status').textContent='Tape loaded. Pick a track.';swapping=false;
}
async function selectTrack(i){if(swapping)return;audio.pause();trackIndex=i;render();const track=albums[albumIndex].tracks[i];$('now').textContent=track.title;if(!track.src){clearAudio();$('status').textContent='This is a placeholder. Audio is coming soon.';return}audio.src=track.src;await start()}
async function start(){try{await audio.play();$('status').textContent='Now playing.'}catch{$('status').textContent='Couldn’t play this track. Try again.'}}
$('play').onclick=()=>{if(swapping)return;if(trackIndex<0){selectTrack(0);return}if(!albums[albumIndex].tracks[trackIndex].src){$('status').textContent='We’ll add the first test track soon.';return}if(audio.paused)start();else audio.pause()};
$('previous').onclick=()=>selectTrack(Math.max(0,trackIndex-1));$('next').onclick=()=>selectTrack((trackIndex+1)%albums[albumIndex].tracks.length);
$('volume').oninput=e=>audio.volume=Number(e.target.value);$('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/100};
const time=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
audio.onloadedmetadata=()=>{if(Number.isFinite(audio.duration)){$('duration').textContent=time(audio.duration);$('seek').disabled=false}};
audio.ontimeupdate=()=>{$('elapsed').textContent=time(audio.currentTime);if(audio.duration)$('seek').value=audio.currentTime/audio.duration*100};
audio.onplay=()=>{$('deck').classList.add('playing');$('play').textContent='Ⅱ';$('play').setAttribute('aria-label','Pause')};
audio.onpause=()=>{$('deck').classList.remove('playing');$('play').textContent='▶';$('play').setAttribute('aria-label','Play')};
audio.onerror=()=>{if(audio.getAttribute('src'))$('status').textContent='This tape couldn’t load. Try another track.'};
// Playback proceeds within the selected album; repeat never triggers tape swap sounds.
function followingTrack(){
 const tracks=albums[albumIndex].tracks;
 if(repeatMode==='song')return trackIndex;
 for(let i=trackIndex+1;i<tracks.length;i++)if(tracks[i].src)return i;
 if(repeatMode==='album')return tracks.findIndex(track=>Boolean(track.src));
 return -1;
}
$('repeat').onclick=()=>{
 repeatMode=repeatMode==='off'?'album':repeatMode==='album'?'song':'off';
 const labels={off:'↻ Repeat off',album:'↻ Repeat album',song:'↻¹ Repeat song'};
 const next={off:'album',album:'song',song:'off'};
 $('repeat').textContent=labels[repeatMode];
 $('repeat').setAttribute('aria-pressed',repeatMode!=='off');
 $('repeat').setAttribute('aria-label','Repeat '+repeatMode+'. Click to repeat '+next[repeatMode]+'.');
};
audio.onended=()=>{
 const next=followingTrack();
 if(next>=0&&albums[albumIndex].tracks[next]?.src){
  if(next===trackIndex){audio.currentTime=0;start()}else selectTrack(next);
 }else $('status').textContent='End of tape.';
};render();
</script></body></html>
